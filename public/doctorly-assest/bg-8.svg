<svg width="1600" height="720" viewBox="0 0 1600 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1600" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FCFF"/>
      <stop offset="0.55" stop-color="#F6FAFF"/>
      <stop offset="1" stop-color="#E8F5FF"/>
    </linearGradient>

    <linearGradient id="rightGlow" x1="940" y1="80" x2="1510" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF7FF"/>
      <stop offset="1" stop-color="#D8EEFF"/>
    </linearGradient>

    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EAF7FF"/>
      <stop offset="1" stop-color="#CFE9FA"/>
    </linearGradient>

    <radialGradient id="bubble" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1260 180) rotate(135) scale(180 180)">
      <stop stop-color="#38BDF8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.05"/>
    </radialGradient>

    <filter id="blur20" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Main banner -->
  <rect x="20" y="20" width="1560" height="680" rx="34" fill="url(#base)" filter="url(#shadow)"/>
  <rect x="20.5" y="20.5" width="1559" height="679" rx="33.5" stroke="#DDECF8"/>

  <!-- Left clean zone -->
  <ellipse cx="280" cy="150" rx="250" ry="180" fill="#FFFFFF" fill-opacity="0.72"/>
  <ellipse cx="520" cy="600" rx="360" ry="140" fill="#EEF8FF" fill-opacity="0.55"/>

  <!-- Right-side photo-like visual zone -->
  <path d="M940 20H1546C1564.78 20 1580 35.22 1580 54V666C1580 684.78 1564.78 700 1546 700H1060C1010 630 982 540 978 456C972 322 1000 184 940 20Z"
        fill="url(#rightGlow)"/>

  <!-- Soft hospital window illusion -->
  <rect x="1175" y="52" width="150" height="360" rx="18" fill="url(#window)" opacity="0.72"/>
  <rect x="1340" y="52" width="170" height="360" rx="18" fill="url(#window)" opacity="0.64"/>
  <rect x="1220" y="52" width="6" height="360" fill="#BBD8E9" opacity="0.45"/>
  <rect x="1398" y="52" width="6" height="360" fill="#BBD8E9" opacity="0.42"/>
  <rect x="1175" y="180" width="335" height="6" fill="#C6DFEE" opacity="0.38"/>

  <!-- Abstract medical/environment shapes -->
  <circle cx="1320" cy="160" r="170" fill="url(#bubble)"/>
  <circle cx="1450" cy="510" r="110" fill="#60A5FA" fill-opacity="0.10"/>
  <circle cx="1120" cy="535" r="150" fill="#38BDF8" fill-opacity="0.08"/>
  <circle cx="1500" cy="135" r="42" fill="#0EA5E9" fill-opacity="0.18"/>

  <!-- Subtle floor/desk blur -->
  <ellipse cx="1265" cy="610" rx="320" ry="78" fill="#CFE9FA" fill-opacity="0.50" filter="url(#blur20)"/>
  <rect x="1010" y="545" width="470" height="18" rx="9" fill="#BFDDF0" fill-opacity="0.35"/>

  <!-- Decorative dots -->
  <g fill="#60A5FA" fill-opacity="0.20">
    <circle cx="1090" cy="210" r="5"/><circle cx="1118" cy="210" r="5"/><circle cx="1146" cy="210" r="5"/>
    <circle cx="1090" cy="238" r="5"/><circle cx="1118" cy="238" r="5"/><circle cx="1146" cy="238" r="5"/>
    <circle cx="1090" cy="266" r="5"/><circle cx="1118" cy="266" r="5"/><circle cx="1146" cy="266" r="5"/>
  </g>

  <!-- Minimal healthcare cross -->
  <g opacity="0.08" transform="translate(150,110)">
    <rect x="30" y="0" width="22" height="82" rx="11" fill="#2563EB"/>
    <rect x="0" y="30" width="82" height="22" rx="11" fill="#2563EB"/>
  </g>

  <!-- Very soft blue swoosh at bottom -->
  <path d="M20 650C240 610 430 640 620 684H20V650Z" fill="#DFF2FF" fill-opacity="0.55"/>
</svg>